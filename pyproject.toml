[project]
name = "job-application-automation"
version = "0.1.0"
description = "Local job discovery and application-assistance system (preparation mode only)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "logs", "screenshots", "exports", "resumes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "N", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"tests/test_submission_browser.py" = ["F811"]  # reuses fixtures imported from test_browser_forms
"scripts/**" = ["E402"]
"run.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "run.py", "tests"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["docx.*", "docxtpl.*"]
ignore_missing_imports = true
